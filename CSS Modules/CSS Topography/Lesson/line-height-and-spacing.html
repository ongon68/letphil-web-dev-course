<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTC-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Line Height and Spacing</title>
        <style>
            .spacing {
                line-height: 1.8; /* 1.8 x font size */
            }

            .letter-spacing {
                letter-spacing: 2px;
            }

            .word-spacing {
                word-spacing: 10px;
            }
        </style>
    </head>
    <body>
        <p class="spacing letter-spacing word-spacing">Lorem ipsum dolor sit amet consectetur adipisicing elit. Obcaecati odio maiores aut at tenetur id minima, molestiae doloremque explicabo harum quos vitae quis tempora porro ut unde, perspiciatis nostrum iusto.</p>
    </body>
</html>
