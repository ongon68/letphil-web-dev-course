<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments and Console logs</title>
</head>
<body>
    <script>
        // This is a comment code line

        /**
         * This is a multi lone comment
         */

        // console.log for debugging
        // console.log() - displays output in the browser
        // console.warn() - show warning message
        // console.error - displays an error mesage

        console.log("This is a message in the console");

        console.warn("This is a warning");

        console.error("This is an error");
    </script>
</body>
</html>
